plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.asolaahoms'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.asolaahoms"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../']
            res.srcDirs = ['../']
        }
    }
}
