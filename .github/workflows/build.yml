name: Build Android APK

on:
  push:
    branches: [ "رئيسي", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      continue-on-error: true

    - name: Build with Gradle
      run: |
        if [ -f ./gradlew ]; then
          ./gradlew assembleDebug
        else
          echo "No gradlew found, traditional project style"
        fi
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/*.apk
